<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 16 - Cálculo Salario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .caja { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 0 auto; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #6f42c1; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #5a32a3; }
    </style>
</head>
<body>
    <div class="caja">
        <h2>Cálculo de Planilla Corta</h2>
        <form action="tarea_16.php" method="POST">
            <label for="emp">Nombre del Empleado:</label>
            <input type="text" id="emp" name="empleado" placeholder="Ej. Ana Gómez" required>
            
            <label for="h">Horas Trabajadas:</label>
            <input type="number" id="h" name="horas" min="1" required>
            
            <label for="p">Pago por Hora ($):</label>
            <input type="number" id="p" name="pago_hora" min="0.01" step="0.01" required>
            
            <button type="submit">Calcular Salario</button>
        </form>
    </div>
</body>
</html>
