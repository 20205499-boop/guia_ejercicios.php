<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11 - Estado del Estudiante</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .caja { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 0 auto; }
        input[type="number"] { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="caja">
        <h2>Control de Notas y Estado</h2>
        <form action="tarea_11.php" method="POST">
            <label for="n1">Nota 1:</label>
            <input type="number" id="n1" name="nota1" min="0" max="10" step="0.1" required>
            
            <label for="n2">Nota 2:</label>
            <input type="number" id="n2" name="nota2" min="0" max="10" step="0.1" required>
            
            <label for="n3">Nota 3:</label>
            <input type="number" id="n3" name="nota3" min="0" max="10" step="0.1" required>
            
            <button type="submit">Verificar Condición</button>
        </form>
    </div>
</body>
</html>
