<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 18 - Factura</title>
</head>
<body>
    <h2>Datos de la Factura</h2>
    <form action="tarea_18.php" method="POST">
        <label for="cliente">Nombre del Cliente:</label><br>
        <input type="text" name="cliente" id="cliente" required><br><br>

        <label for="producto">Nombre del Producto:</label><br>
        <input type="text" name="producto" id="producto" required><br><br>

        <label for="cantidad">Cantidad:</label><br>
        <input type="number" name="cantidad" id="cantidad" min="1" required><br><br>

        <label for="precio">Precio Unitario ($):</label><br>
        <input type="number" step="0.01" name="precio" id="precio" min="0" required><br><br>

        <input type="submit" value="Generar Factura">
    </form>
</body>
</html>
