<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Datos Personales</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .caja { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 0 auto; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #fd7e14; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #e36c09; }
    </style>
</head>
<body>
    <div class="caja">
        <h2>Datos de la Persona</h2>
        <form action="tarea_6.php" method="POST">
            <label for="nom">Escribe tu nombre:</label>
            <input type="text" id="nom" name="nombre" placeholder="Ej. Carlos" required>
            <label for="ed">Escribe tu edad:</label>
            <input type="number" id="ed" name="edad" min="1" max="120" required>
            <button type="submit">Enviar Datos</button>
        </form>
    </div>
</body>
</html>
